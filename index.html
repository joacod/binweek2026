<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8e9" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/png" sizes="192x192" href="/src/game/art/binagora-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="preload" as="image" type="image/png" fetchpriority="high" href="/src/game/art/binagora-logo.png" />
    <style>
      html, body, #app { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff8e9; color: #323232; font-family: system-ui, sans-serif; }
      /* Instant, self-contained splash that mirrors the game card while the module boots. */
      .binweek-introduction { position: fixed; inset: 0; z-index: 10; box-sizing: border-box; display: grid; place-items: center start; padding: clamp(18px, 4vw, 64px); background: #fff8e9; color: #323232; font: 14px/1.5 system-ui, sans-serif; }
      .binweek-introduction-card { position: relative; box-sizing: border-box; width: min(470px, 100%); padding: 28px; border: 1px solid #e4d8c1; border-radius: 22px; background: #fffaf0; box-shadow: 0 18px 70px #5c583324; }
      .binweek-introduction-card::before { content: ''; position: absolute; top: 0; left: 28px; width: 64px; height: 3px; border-radius: 0 0 3px 3px; background: #F59E2B; }
      .binweek-introduction-place { margin: 0 0 10px; color: #946020; font: 700 9px/1.5 system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
      .binweek-introduction h1 { margin: 0; color: #323232; font: 800 clamp(30px, 3.3vw, 40px)/1.06 'Avenir Next', system-ui, sans-serif; letter-spacing: -.055em; }
      .binweek-introduction-subtitle { margin: 10px 0 0; color: #9b5f11; font: italic 21px/1.2 Georgia, serif; }
      .binweek-introduction-copy { margin-top: 16px; max-width: 36ch; color: #58574e; }
      .binweek-introduction-copy p { margin: 0 0 .7rem; line-height: 1.65; }
      .binweek-introduction-status { display: flex; align-items: center; gap: 10px; margin: 18px 0 0; padding-top: 14px; border-top: 1px solid #e5dccb; color: #8b6228; font: 600 11px/1.6 system-ui, sans-serif; }
      .binweek-introduction-status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #F59E2B; animation: binweek-loading 1.1s ease-in-out infinite; }
      @keyframes binweek-loading { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
      @media (max-width: 600px) {
        .binweek-introduction { place-items: center; padding: 14px; }
        .binweek-introduction-card { padding: 22px; }
        .binweek-introduction h1 { font-size: 34px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .binweek-introduction-status::before { animation: none; opacity: 1; transform: none; }
      }
    </style>
    <!--site-metadata-->
  </head>
  <body>
    <div id="app"><!--game-introduction--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
